<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LGU Research Output</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: one working column — search, filters, summary counts, year chart, then the paper register. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --ink:#18201c; --muted:#5b665f; --line:#d9ded8;
  --accent:#1f5c4a; --accent-soft:#e3eee9; --amber:#9a6a12;
  --w:#1f5c4a; --x:#2f6f9f; --y:#8a6416; --z:#7a4f80; --none:#8b948e;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201c; --ink:#e6ebe7; --muted:#9aa59e; --line:#2c3630;
  --accent:#6cc3a5; --accent-soft:#1d3029; --amber:#e0b35a;
  --w:#6cc3a5; --x:#78b3e0; --y:#e0b35a; --z:#c79bd0; --none:#7d8780; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201c; --ink:#e6ebe7; --muted:#9aa59e; --line:#2c3630;
  --accent:#6cc3a5; --accent-soft:#1d3029; --amber:#e0b35a;
  --w:#6cc3a5; --x:#78b3e0; --y:#e0b35a; --z:#c79bd0; --none:#7d8780; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font:500 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance}
h2{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
.asof{font:13px/1.4 var(--body);color:var(--muted);text-align:right}
.asof b{color:var(--ink);font-weight:600}
@media (max-width:600px){.asof{text-align:left}}
.search{position:relative}
.search input{width:100%;font:16px var(--body);padding:14px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;z-index:5;max-height:340px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:14px var(--body);cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--accent-soft);outline:none}
.sugg small{color:var(--muted);font-family:var(--mono)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:grid;gap:4px;font:500 12px var(--body);color:var(--muted);letter-spacing:.03em}
select,.btn{font:14px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.btn{cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.profile{display:grid;gap:4px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px}
.profile .meta{color:var(--muted);font-size:14px}
.profile a{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.tile .n{font:500 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);letter-spacing:.03em}
.tile.total .n{color:var(--accent)}
.tile .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--muted);font:11px var(--mono)}
.chart .val{fill:var(--ink)}
.bars line{stroke:var(--line)}
.list{display:grid;gap:6px;font-size:14px}
.list div{display:flex;justify-content:space-between;gap:10px}
.list span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list span:last-child{font-family:var(--mono);color:var(--muted)}
.tablebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ttl{font-weight:500}
.ttl a{color:var(--ink);text-decoration:none}
.ttl a:hover{color:var(--accent);text-decoration:underline}
.au{color:var(--muted);font-size:13px;margin-top:2px}
.au b{color:var(--ink);font-weight:600}
.cat{display:inline-block;min-width:26px;text-align:center;font:600 12px var(--mono);padding:2px 6px;border-radius:4px;color:var(--bg)}
.cat.W{background:var(--w)}.cat.X{background:var(--x)}.cat.Y{background:var(--y)}.cat.Z{background:var(--z)}
.cat.none{background:none;color:var(--none);border:1px dashed var(--none)}
.idx{font:500 11px var(--mono);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.idx span{border:1px solid var(--line);padding:1px 5px;border-radius:3px}
.idx .on{border-color:var(--accent);color:var(--accent)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">ORIC · Lahore Garrison University</div>
      <h1>LGU Research Output</h1>
    </div>
    <div class="asof" id="asof">Loading publication register…</div>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="Type a faculty member's name, or search titles, journals, DOIs" aria-label="Search">
    <div class="sugg" id="sugg" hidden></div>
  </div>

  <div class="filters">
    <label for="fy">From<select id="fy"></select></label>
    <label for="ty">To<select id="ty"></select></label>
    <label for="fc">HJRS category<select id="fc">
      <option value="">All</option><option>W</option><option>X</option><option>Y</option><option>Z</option>
      <option value="WXYZ">Any HJRS (W–Z)</option><option value="none">Not mapped</option></select></label>
    <label for="fi">Indexing<select id="fi">
      <option value="">All</option><option value="scopus">Scopus-indexed</option><option value="wos">Web of Science</option></select></label>
    <label for="ft">Type<select id="ft"><option value="">All types</option></select></label>
    <label for="fd">Department<select id="fd"><option value="">All departments</option></select></label>
    <span id="who"></span>
  </div>

  <div id="profile"></div>
  <div class="tiles" id="tiles"></div>

  <div class="two">
    <section class="panel">
      <h2>Publications per year</h2>
      <div class="chart" id="chart"></div>
    </section>
    <section class="panel">
      <h2 id="sideH">Top journals</h2>
      <div class="list" id="side"></div>
    </section>
  </div>

  <section style="display:grid;gap:10px">
    <div class="tablebar">
      <h2 id="regH">Publication register</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="sort" aria-label="Sort">
          <option value="new">Newest first</option><option value="old">Oldest first</option><option value="cite">Most cited</option></select>
        <button class="btn primary" id="csv">Export CSV</button>
      </div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th style="width:50%">Paper</th><th>Journal / venue</th><th>Year</th><th>HJRS</th><th>Indexed</th><th style="text-align:right">Cites</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table></div>
    <div class="pager" id="pager"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const nameKey = s => norm(s).replace(/\b(dr|prof|professor|engr|mr|mrs|ms|miss|sir)\b/g," ").split(/\s+/).filter(Boolean).sort().join(" ");
const fmt = n => Number(n).toLocaleString("en-US");
const TYPE_LABEL = {"article":"Journal article","review":"Review","book-chapter":"Book chapter","book":"Book","preprint":"Preprint","dissertation":"Thesis","conference paper":"Conference paper","proceedings-article":"Conference paper","editorial":"Editorial","letter":"Letter","other":"Other","dataset":"Dataset","erratum":"Erratum","paratext":"Front matter"};
let D, W = [], AUTH = [], state = {author:null, q:"", page:0};
const PAGE = 50;

async function boot(){
  try{
    const r = await fetch("data.json", {cache:"no-cache"});
    if(!r.ok) throw new Error(r.status);
    D = await r.json();
  }catch(e){
    $("#asof").textContent = "data.json could not be loaded. Run harvest.py to build it.";
    $("#rows").innerHTML = `<tr><td colspan="6" class="empty">No data yet. Run <code>python harvest.py</code>, then reload this page.</td></tr>`;
    return;
  }
  W = D.works;
  for(const w of W){ w._s = norm([w.t,w.j,w.doi,w.au.map(a=>a.n).join(" ")].join(" ")); w._ty = TYPE_LABEL[w.ty] || (w.ty ? w.ty[0].toUpperCase()+w.ty.slice(1) : "Other"); }
  buildAuthors();
  const yrs = W.map(w=>w.y).filter(Boolean), y0 = Math.min(D.start_year, ...yrs), y1 = Math.max(...yrs, new Date().getFullYear());
  for(let y=y0;y<=y1;y++){ $("#fy").add(new Option(y,y)); $("#ty").add(new Option(y,y)); }
  $("#fy").value = y0; $("#ty").value = y1;
  [...new Set(W.map(w=>w._ty))].sort().forEach(t=>$("#ft").add(new Option(t,t)));
  [...new Set(D.faculty.map(f=>f.dept).filter(Boolean))].sort().forEach(d=>$("#fd").add(new Option(d,d)));
  if(!D.faculty.some(f=>f.dept)) $("#fd").closest("label").hidden = true;
  const g = new Date(D.generated);
  $("#asof").innerHTML = `Counts as of <b>${g.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</b><br>Sources: ${Object.keys(D.sources).join(" · ")}`;
  $("#foot").innerHTML = footer();
  ["#fy","#ty","#fc","#fi","#ft","#fd","#sort"].forEach(s=>$(s).addEventListener("change",()=>{state.page=0;render()}));
  render();
}

function buildAuthors(){
  const map = new Map();
  W.forEach((w,wi)=>w.au.forEach(a=>{
    if(!a.lgu) return;
    const k = a.f!=null ? "f"+a.f : (a.id ? "a"+a.id : "n"+nameKey(a.n));
    let e = map.get(k);
    if(!e){ const f = a.f!=null ? D.faculty[a.f] : null;
      e = {k, name: f ? f.name : a.n, fac: f, alt:new Set(), works:new Set(), key: norm(f ? f.name+" "+(f.keys||[]).join(" ") : a.n)}; map.set(k,e); }
    e.alt.add(a.n); e.works.add(wi); e.key += " " + norm(a.n);
  }));
  // faculty listed in faculty.csv with zero matched papers still appear in search
  D.faculty.forEach((f,i)=>{ if(!map.has("f"+i)) map.set("f"+i,{k:"f"+i,name:f.name,fac:f,alt:new Set(),works:new Set(),key:norm(f.name+" "+(f.keys||[]).join(" "))}); });
  AUTH = [...map.values()].sort((a,b)=>b.works.size-a.works.size);
}

function suggest(){
  const q = norm($("#q").value), box = $("#sugg");
  if(q.length < 2){ box.hidden = true; return; }
  const toks = q.split(" ");
  const hits = AUTH.filter(a=>toks.every(t=>a.key.includes(t))).slice(0,8);
  if(!hits.length){ box.hidden = true; return; }
  box.innerHTML = hits.map((a,i)=>`<button type="button" data-k="${esc(a.k)}"><span>${esc(a.name)}${a.fac&&a.fac.dept?` <small>· ${esc(a.fac.dept)}</small>`:""}</span><small>${a.works.size} papers</small></button>`).join("")
    + `<button type="button" data-k=""><span>Search all papers for “${esc($("#q").value)}”</span><small>text</small></button>`;
  box.hidden = false;
}
$("#q").addEventListener("input",()=>{ suggest(); state.q = $("#q").value; state.page=0; render(); });
$("#q").addEventListener("keydown",e=>{ if(e.key==="ArrowDown"){ const b=$("#sugg button"); if(b){e.preventDefault();b.focus();} } if(e.key==="Escape") $("#sugg").hidden=true; });
$("#sugg").addEventListener("keydown",e=>{ const b=document.activeElement; if(e.key==="ArrowDown"&&b.nextElementSibling){e.preventDefault();b.nextElementSibling.focus();} if(e.key==="ArrowUp"){e.preventDefault();(b.previousElementSibling||$("#q")).focus();} });
$("#sugg").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  $("#sugg").hidden = true;
  if(b.dataset.k){ state.author = AUTH.find(a=>a.k===b.dataset.k); state.q=""; $("#q").value=""; }
  state.page=0; render();
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) $("#sugg").hidden=true; });

function filtered(){
  const fy=+$("#fy").value, ty=+$("#ty").value, fc=$("#fc").value, fi=$("#fi").value, ft=$("#ft").value, fd=$("#fd").value;
  const toks = norm(state.q).split(" ").filter(Boolean);
  const set = state.author ? state.author.works : null;
  return W.filter((w,i)=>{
    if(set && !set.has(i)) return false;
    if(w.y && (w.y<fy || w.y>ty)) return false;
    if(fc==="none" ? !!w.hjrs : fc==="WXYZ" ? !w.hjrs : fc && w.hjrs!==fc) return false;
    if(fi==="scopus" && !w.scopus) return false;
    if(fi==="wos" && !w.wos) return false;
    if(ft && w._ty!==ft) return false;
    if(fd && !w.au.some(a=>a.f!=null && D.faculty[a.f].dept===fd)) return false;
    if(toks.length && !toks.every(t=>w._s.includes(t))) return false;
    return true;
  });
}

function render(){
  const rows = filtered(), a = state.author;
  $("#who").innerHTML = a ? `<span class="chip">${esc(a.name)} <button type="button" id="clr" aria-label="Clear faculty filter">×</button></span>` : "";
  if(a) $("#clr").onclick = ()=>{ state.author=null; state.page=0; render(); };
  renderProfile(rows, a);
  renderTiles(rows);
  renderChart(rows);
  renderSide(rows, a);
  renderTable(rows);
}

function hIndex(rows){ const c = rows.map(w=>w.c).sort((x,y)=>y-x); let h=0; while(h<c.length && c[h]>h) h++; return h; }

function renderProfile(rows, a){
  if(!a){ $("#profile").innerHTML=""; return; }
  const f = a.fac, cites = rows.reduce((s,w)=>s+w.c,0);
  const variants = [...a.alt].filter(n=>n!==a.name);
  $("#profile").innerHTML = `<div class="profile"><h2>${esc(a.name)}</h2>
    <div class="meta">${[f&&f.desig,f&&f.dept].filter(Boolean).map(esc).join(" · ") || "LGU-affiliated author"}
    · ${fmt(rows.length)} publications in range · ${fmt(cites)} citations · h-index ${hIndex(rows)}</div>
    ${variants.length?`<div class="meta">Also published as: ${variants.map(esc).join(", ")}</div>`:""}
    <div class="meta">${[f&&f.scholar?`<a href="${esc(f.scholar)}" target="_blank" rel="noopener">Google Scholar profile</a>`:"",
      f&&f.orcid?`<a href="https://orcid.org/${esc(f.orcid)}" target="_blank" rel="noopener">ORCID</a>`:""].filter(Boolean).join(" · ")}</div></div>`;
}

function renderTiles(rows){
  const c = k => rows.filter(w=>w.hjrs===k).length;
  const tiles = [
    ["total", rows.length, "Total publications"],
    ["", rows.filter(w=>w.scopus).length, D.scopus_live ? "Scopus-indexed" : "Scopus (journal list)"],
    ["", rows.filter(w=>w.wos).length, "Web of Science"],
    ["", c("W"), "HJRS W", "w"], ["", c("X"), "HJRS X", "x"], ["", c("Y"), "HJRS Y", "y"], ["", c("Z"), "HJRS Z", "z"],
    ["", rows.filter(w=>!w.hjrs).length, "Not mapped to HJRS", "none"],
  ];
  $("#tiles").innerHTML = tiles.map(([cls,n,l,sw])=>`<div class="tile ${cls}"><div class="n">${fmt(n)}</div><div class="l">${sw?`<span class="sw" style="background:var(--${sw})"></span>`:""}${l}</div></div>`).join("");
}

function renderChart(rows){
  const fy=+$("#fy").value, ty=+$("#ty").value, yrs=[];
  for(let y=fy;y<=ty;y++) yrs.push(y);
  const cats = ["W","X","Y","Z",""], col = {W:"var(--w)",X:"var(--x)",Y:"var(--y)",Z:"var(--z)","":"var(--none)"};
  const by = Object.fromEntries(yrs.map(y=>[y,{W:0,X:0,Y:0,Z:0,"":0}]));
  rows.forEach(w=>{ if(by[w.y]) by[w.y][w.hjrs||""]++; });
  const tot = y => cats.reduce((s,c)=>s+by[y][c],0);
  const max = Math.max(1,...yrs.map(tot));
  const step = max<=5?1:Math.pow(10,Math.floor(Math.log10(max))) * (max/Math.pow(10,Math.floor(Math.log10(max)))>5?2:1);
  const top = Math.ceil(max/step)*step;
  const Wd=760, H=260, L=40, R=10, T=18, B=26, bw=(Wd-L-R)/yrs.length;
  const sy = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Publications per year by HJRS category"><g class="bars">`;
  for(let v=0; v<=top; v+=step) s += `<line x1="${L}" x2="${Wd-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${v}</text>`;
  yrs.forEach((y,i)=>{
    let acc=0; const x = L + i*bw + bw*.15, w = bw*.7;
    cats.forEach(c=>{ const n=by[y][c]; if(!n) return; s += `<rect x="${x}" y="${sy(acc+n)}" width="${w}" height="${sy(acc)-sy(acc+n)}" fill="${col[c]}"><title>${y} · ${c||"Not mapped"}: ${n}</title></rect>`; acc+=n; });
    if(acc) s += `<text class="val" x="${x+w/2}" y="${sy(acc)-4}" text-anchor="middle">${acc}</text>`;
    if(yrs.length<=16 || i%2===0) s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${yrs.length>10?"’"+String(y).slice(2):y}</text>`;
  });
  s += `</g></svg>`;
  $("#chart").innerHTML = s;
}

function renderSide(rows, a){
  const count = (arr) => { const m=new Map(); arr.forEach(k=>{ if(k) m.set(k,(m.get(k)||0)+1); }); return [...m].sort((x,y)=>y[1]-x[1]).slice(0,10); };
  let list, h;
  if(a){ h="Frequent co-authors"; list = count(rows.flatMap(w=>w.au.map(x=>x.n).filter(n=>!a.alt.has(n)&&n!==a.name))); }
  else if(!state.q && !$("#fd").value){ h="Most published LGU authors"; const rs = new Set(rows); list = AUTH.map(x=>[x.name,[...x.works].filter(i=>rs.has(W[i])).length]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]).slice(0,10); }
  else { h="Top journals"; list = count(rows.map(w=>w.j)); }
  $("#sideH").textContent = h;
  $("#side").innerHTML = list.length ? list.map(([k,n])=>`<div><span title="${esc(k)}">${esc(k)}</span><span>${n}</span></div>`).join("") : `<div class="note">Nothing in this selection.</div>`;
}

function sorted(rows){
  const s=$("#sort").value, r=[...rows];
  if(s==="old") r.sort((a,b)=>(a.d||String(a.y)).localeCompare(b.d||String(b.y)));
  else if(s==="cite") r.sort((a,b)=>b.c-a.c);
  else r.sort((a,b)=>(b.d||String(b.y)).localeCompare(a.d||String(a.y)));
  return r;
}

function renderTable(rows){
  const r = sorted(rows), pages = Math.max(1,Math.ceil(r.length/PAGE));
  state.page = Math.min(state.page, pages-1);
  const slice = r.slice(state.page*PAGE, state.page*PAGE+PAGE);
  $("#regH").textContent = `Publication register · ${fmt(r.length)}`;
  const me = state.author;
  $("#rows").innerHTML = slice.length ? slice.map(w=>{
    const link = w.doi ? `https://doi.org/${w.doi}` : (w.id.startsWith("W") ? `https://openalex.org/${w.id}` : "");
    const au = w.au.slice(0,8).map(x=>{ const mine = me && (me.alt.has(x.n)); const n=esc(x.n); return mine?`<b>${n}</b>`:(x.lgu?`<span title="LGU">${n}*</span>`:n); }).join(", ") + (w.au.length>8?` +${w.au.length-8}`:"");
    return `<tr><td><div class="ttl">${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(w.t)}</a>`:esc(w.t)}</div>
      <div class="au">${au}</div></td>
      <td>${esc(w.j)||`<span class="note">${esc(w._ty)}</span>`}${w.vol?`<div class="au">Vol ${esc(w.vol)}${w.iss?`(${esc(w.iss)})`:""}${w.pg?`, ${esc(w.pg)}`:""}</div>`:""}</td>
      <td class="num">${w.y||"—"}</td>
      <td>${w.hjrs?`<span class="cat ${w.hjrs}">${w.hjrs}</span>`:`<span class="cat none" title="Journal not in data/journals.csv">–</span>`}</td>
      <td><div class="idx"><span class="${w.scopus?"on":""}">Scopus</span><span class="${w.wos?"on":""}">WoS</span></div></td>
      <td class="num">${fmt(w.c)}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="empty">No publications match these filters.</td></tr>`;
  $("#pager").innerHTML = pages>1 ? `<button class="btn" id="pp" ${state.page?"":"disabled"}>Previous</button> Page ${state.page+1} of ${pages} <button class="btn" id="pn" ${state.page<pages-1?"":"disabled"}>Next</button>` : "";
  if(pages>1){ $("#pp").onclick=()=>{state.page--;renderTable(filtered());}; $("#pn").onclick=()=>{state.page++;renderTable(filtered());}; }
}

$("#csv").addEventListener("click",()=>{
  const r = sorted(filtered());
  const head = ["Title","Authors","LGU authors","Journal/Venue","ISSN","Year","Type","HJRS category","Scopus","Web of Science","Volume","Issue","Pages","DOI","Citations","Sources"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines = [head.map(q).join(",")].concat(r.map(w=>[w.t,w.au.map(a=>a.n).join("; "),w.au.filter(a=>a.lgu).map(a=>a.n).join("; "),w.j,w.issn.join(" "),w.y,w._ty,w.hjrs||"",w.scopus?"Yes":"",w.wos?"Yes":"",w.vol,w.iss,w.pg,w.doi,w.c,w.src.join(" + ")].map(q).join(",")));
  const blob = new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"});
  const a = document.createElement("a");
  const who = state.author ? state.author.name.replace(/[^\w]+/g,"_") : "LGU";
  a.href = URL.createObjectURL(blob); a.download = `${who}_publications_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});

function footer(){
  const s = D.sources;
  return `<div>Records found per source this run: ${Object.entries(s).map(([k,v])=>`${esc(k)} ${fmt(v)}`).join(" · ")}. Duplicates across sources are merged by DOI, then by title and year.</div>
  <div>HJRS categories, Web of Science status${D.scopus_live?"":" and Scopus status"} come from ORIC's journal list (${fmt(D.journal_rows)} rows in data/journals.csv). A dash in the HJRS column means the journal is not in that list yet.</div>
  <div>* marks an author whose affiliation on that paper is LGU. Bold marks the selected faculty member.</div>`;
}
boot();
</script>
</body>
</html>
